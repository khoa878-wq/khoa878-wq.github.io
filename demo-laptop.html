<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nguyễn Khoa · Laptop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&family=Caveat+Brush&display=swap" rel="stylesheet">
<!-- Trang thử "lặn vào laptop": học kỹ thuật từ bản mô tả mẫu Haldoren (Khoa gửi 23/11/2026), dựng lại hoàn toàn bằng
     ảnh thật của Khoa (images/khoa-cut.webp), banner + clip dự án thật (content.json → showcase). Không dùng ảnh/video AI hay tài nguyên của mẫu gốc.
     Một màn hình, không cuộn trang: lăn chuột / vuốt / phím để vào laptop và đổi dự án. -->
<style>
:root { --bg:#141511; --ink:#141412; --lime:#dbfa76; --mint:#eefbc7; --muted:#c2c0b2; --n:1px; }
* { box-sizing:border-box; margin:0; }
html, body { height:100%; overflow:hidden; }
body { background:var(--bg); color:#fff; font-family:'Be Vietnam Pro', system-ui, sans-serif; -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
a { color:inherit; text-decoration:none; }
:focus-visible { outline:3px solid var(--lime); outline-offset:3px; }

/* Sân khấu */
.stage { position:fixed; inset:0; overflow:hidden; background:radial-gradient(ellipse 80% 70% at 50% 95%, #3d4a1f 0%, #22281a 45%, var(--bg) 100%); }
.stage::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 70% 60% at 50% 55%, #2e3a1c 0%, var(--bg) 75%); opacity:0; transition:opacity 1s; }
body.is-case .stage::before { opacity:1; }

/* Hero */
.hero { position:absolute; inset:0; transform-origin:50% 62%; }
.wm { position:absolute; left:2vw; right:2vw; top:calc(70 * var(--n)); height:calc(250 * var(--n)); width:96vw; overflow:visible; }
.wm text { font-family:'Be Vietnam Pro', sans-serif; font-weight:900; font-size:240px; }
.me { position:absolute; left:50%; bottom:-12vh; -webkit-mask-image:linear-gradient(to right, transparent 0, #000 20%), linear-gradient(to top, transparent 0, #000 22%); -webkit-mask-composite:source-in; mask-image:linear-gradient(to right, transparent 0, #000 20%), linear-gradient(to top, transparent 0, #000 22%); mask-composite:intersect; /* ảnh gốc bị cắt thẳng mép trái + vùng che thẻ ở dưới */ height:min(88vh, 125vw); transform:translateX(-46%); filter:drop-shadow(0 30px 40px #0008); pointer-events:none; user-select:none; }
.script { position:absolute; left:6vw; top:calc(250 * var(--n)); font-family:'Caveat Brush', cursive; font-size:calc(78 * var(--n)); line-height:1; color:var(--lime); transform:rotate(-8deg); transform-origin:0 50%; text-shadow:0 2px 14px #0006; white-space:nowrap; }

/* Thẻ đeo (vẽ bằng CSS) */
.badge { position:absolute; right:5vw; top:0; width:calc(250 * var(--n)); transform-origin:50% 0; pointer-events:none; }
.strap { width:calc(26 * var(--n)); height:calc(270 * var(--n)); margin:0 auto; background:repeating-linear-gradient(90deg, #8fbf3a 0 2px, #7aad2c 2px 4px); box-shadow:inset 0 0 0 1px #0002; }
.clip { width:calc(46 * var(--n)); height:calc(26 * var(--n)); margin:-2px auto 0; border-radius:6px 6px 10px 10px; background:linear-gradient(#e9ece6, #9da39a); box-shadow:0 2px 4px #0005; }
.card { position:relative; margin-top:calc(-4 * var(--n)); background:#fff; color:var(--ink); border-radius:calc(12 * var(--n)); padding:calc(22 * var(--n)) calc(18 * var(--n)) calc(16 * var(--n)); box-shadow:0 24px 50px #0009; pointer-events:auto; cursor:grab; }
.card::before { content:''; position:absolute; left:50%; top:calc(8 * var(--n)); width:calc(46 * var(--n)); height:calc(7 * var(--n)); margin-left:calc(-23 * var(--n)); border-radius:9px; background:#d8dbd3; }
.card h4 { font-size:calc(26 * var(--n)); line-height:.95; font-weight:900; letter-spacing:-.03em; }
.card .yr { position:absolute; right:calc(18 * var(--n)); top:calc(24 * var(--n)); font-size:calc(11 * var(--n)); font-weight:700; }
.card .role { margin-top:calc(10 * var(--n)); padding-top:calc(5 * var(--n)); border-top:1px solid #222; font-size:calc(10 * var(--n)); font-weight:700; letter-spacing:.02em; }
.card .ph { display:block; width:calc(96 * var(--n)); height:calc(96 * var(--n)); margin:calc(12 * var(--n)) auto; border-radius:50%; object-fit:cover; background:var(--lime); }
.card .row { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; font-size:calc(9.5 * var(--n)); font-weight:700; padding:calc(6 * var(--n)) 0 calc(3 * var(--n)); border-bottom:1.5px dotted #333; }
.card .row b { font-weight:600; text-align:right; }

/* Laptop (vẽ bằng CSS) */
.laptop { position:absolute; left:50%; top:50%; width:var(--lw); transform:translate(-50%, -46%); opacity:0; pointer-events:none; }
.lid { position:relative; background:linear-gradient(#2b2c2a, #1a1b19); border-radius:calc(var(--lw) * .022) calc(var(--lw) * .022) 4px 4px; padding:calc(var(--lw) * .022); box-shadow:0 0 0 1px #4a4b47, 0 40px 80px #000a; }
.screen { position:relative; aspect-ratio:16/9; background:#000; border-radius:3px; overflow:hidden; }
.screen video, .screen img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; }
.screen::after { content:''; position:absolute; inset:0; background:linear-gradient(115deg, #ffffff12 0%, #fff0 38%); pointer-events:none; }
.flash { position:absolute; inset:0; background:#fff; opacity:0; z-index:2; }
.base { position:relative; width:112%; margin-left:-6%; height:calc(var(--lw) * .028); background:linear-gradient(#d9dbd6, #8e918b); border-radius:2px 2px calc(var(--lw) * .02) calc(var(--lw) * .02); box-shadow:0 18px 30px #0008; }
.base::before { content:''; position:absolute; left:42%; right:42%; top:0; height:40%; background:#a9aca6; border-radius:0 0 6px 6px; }
.screen-hit { position:absolute; inset:0; cursor:pointer; pointer-events:none; }
body.is-case .laptop, body.is-case .screen-hit { pointer-events:auto; }

/* Lớp giao diện cố định */
.ui { position:fixed; inset:0; z-index:20; pointer-events:none; }
.ui > * { pointer-events:auto; }
.tag { position:absolute; top:calc(16 * var(--n)); display:inline-flex; align-items:center; height:calc(38 * var(--n)); padding:0 calc(18 * var(--n)); background:#fff; color:var(--ink); font-weight:650; font-size:calc(16 * var(--n)); letter-spacing:-.02em; white-space:nowrap; box-shadow:0 calc(3 * var(--n)) 0 #0004, 0 calc(6 * var(--n)) calc(14 * var(--n)) #0004; transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
.tag:hover { transform:translateY(calc(-2 * var(--n))) rotate(-1.5deg); box-shadow:0 calc(5 * var(--n)) 0 #0005, 0 calc(10 * var(--n)) calc(18 * var(--n)) #0004; }
.tag:active { transform:translateY(var(--n)); box-shadow:0 var(--n) 0 #0005; }
.tag.lime { background:var(--lime); }
.t1 { left:calc(30 * var(--n)); } .t2 { left:calc(200 * var(--n)); } .t3 { right:calc(220 * var(--n)); } .t4 { right:calc(30 * var(--n)); }
.logo { position:absolute; left:50%; top:calc(22 * var(--n)); transform:translateX(-50%); font-weight:800; font-size:calc(20 * var(--n)); letter-spacing:-.03em; opacity:0; transition:opacity .4s; pointer-events:none; }
.logo span { color:var(--lime); }
body.is-case .logo { opacity:1; pointer-events:auto; }
.hint { position:absolute; left:50%; bottom:calc(22 * var(--n)); transform:translateX(-50%); display:flex; align-items:center; gap:12px; font-size:calc(12 * var(--n)); letter-spacing:.18em; text-transform:uppercase; font-weight:650; opacity:.9; background:#141511b3; padding:8px 16px; border-radius:99px; }
.hint i { position:relative; width:1.5px; height:22px; background:#ffffff59; overflow:hidden; }
.hint i::after { content:''; position:absolute; left:0; top:-40%; width:100%; height:40%; background:var(--lime); animation:drip 1.6s cubic-bezier(.6,0,.4,1) infinite; }
@keyframes drip { to { top:100%; } }
body.is-case .hint, body.busy .hint { visibility:hidden; }

/* Phiếu dự án + mô tả + nút */
.ticket { position:absolute; right:calc(32 * var(--n)); top:calc(96 * var(--n)); width:calc(360 * var(--n)); background:#fff; color:var(--ink); border-radius:calc(3 * var(--n)); box-shadow:0 calc(18 * var(--n)) calc(40 * var(--n)) #0007; padding:calc(26 * var(--n)) calc(34 * var(--n)) calc(18 * var(--n)) calc(44 * var(--n)); transform-origin:50% 0; opacity:0; visibility:hidden; }
body.is-case .ticket { visibility:visible; }
.hole { position:absolute; width:calc(20 * var(--n)); height:calc(20 * var(--n)); border-radius:50%; background:var(--bg); box-shadow:inset 0 calc(2 * var(--n)) calc(3 * var(--n)) #0008; }
.h1 { left:calc(12 * var(--n)); top:calc(12 * var(--n)); } .h2 { right:calc(12 * var(--n)); top:calc(12 * var(--n)); } .h3 { left:calc(12 * var(--n)); bottom:calc(12 * var(--n)); } .h4 { right:calc(12 * var(--n)); bottom:calc(12 * var(--n)); }
.ticket h2 { font-weight:900; font-size:calc(34 * var(--n)); line-height:1.14; letter-spacing:-.04em; text-transform:uppercase; }
.rows { margin-top:calc(10 * var(--n)); }
.rows div { text-align:right; font-weight:700; font-size:calc(12 * var(--n)); letter-spacing:.02em; padding:calc(4 * var(--n)) 0 calc(3 * var(--n)); border-bottom:1.5px dotted #2a2a2a; }
.go { display:inline-block; margin-top:calc(12 * var(--n)); background:var(--ink); color:var(--lime); font-weight:700; font-size:calc(13 * var(--n)); padding:calc(7 * var(--n)) calc(14 * var(--n)); border-radius:99px; }
.go:hover { background:#000; }
.desc { position:absolute; left:calc(30 * var(--n)); top:calc(300 * var(--n)); width:calc(210 * var(--n)); visibility:hidden; }
body.is-case .desc { visibility:visible; }
.desc > * { opacity:0; }
.desc .k { font-weight:700; font-size:calc(17 * var(--n)); letter-spacing:-.02em; color:var(--lime); }
.desc p { margin-top:calc(14 * var(--n)); font-size:calc(15 * var(--n)); line-height:1.4; font-weight:500; color:#ffffffeb; }
.desc .num { margin-top:calc(22 * var(--n)); font-size:calc(12 * var(--n)); letter-spacing:.16em; font-weight:700; color:#ffffffb3; }
.nav-case { position:absolute; bottom:calc(120 * var(--n)); display:flex; flex-direction:column; align-items:center; gap:calc(9 * var(--n)); font-weight:600; font-size:calc(15 * var(--n)); line-height:1.05; text-align:center; opacity:0; visibility:hidden; transition:opacity .3s; }
body.is-case .nav-case { opacity:1; visibility:visible; }
.prev { left:calc(70 * var(--n)); } .next { right:calc(70 * var(--n)); }
.nav-case .c { display:grid; place-items:center; width:calc(52 * var(--n)); height:calc(52 * var(--n)); border-radius:50%; border:1.6px solid #ffffffe6; transition:transform .25s, background .25s; }
.nav-case svg { width:calc(24 * var(--n)); height:calc(24 * var(--n)); fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.nav-case:hover .c { transform:scale(1.08); }
.next .c { background:var(--lime); border-color:var(--lime); color:var(--ink); }
.next:hover .c { background:var(--mint); }
.prev.dim { opacity:.45; }

/* Điện thoại, máy tính bảng */
@media (max-width:820px) {
  :root { --n:calc(100vw / 430); }
  .tag { height:30px; padding:0 12px; font-size:13px; top:12px; }
  .t1 { left:12px; } .t2 { left:auto; right:12px; }
  .t3 { left:12px; right:auto; top:52px; } .t4 { right:12px; top:52px; }
  .wm { top:calc(100px + 4vw); height:28vw; }
  .script { left:auto; right:5vw; top:calc(100px + 26vw); font-size:12vw; }
  .badge { width:32vw; right:3vw; top:calc(-60px + 24vw); }
  .badge .strap { height:30vw; }
  .me { height:min(64vh, 120vw); transform:translateX(-52%); }
  .logo { display:none; }
  body.is-case .t3, body.is-case .t4 { visibility:hidden; }
  .ticket { left:50%; right:auto; top:56px; width:min(88vw, 380px); margin-left:max(-44vw, -190px); padding:20px 26px 14px 36px; }
  .ticket h2 { font-size:26px; } .rows div { font-size:11px; } .hole { width:13px; height:13px; } .go { font-size:12px; }
  .desc { left:6vw; right:6vw; width:auto; top:calc(56px + var(--th, 200px) + 14px); text-align:center; }
  .desc .k { font-size:15px; } .desc p { font-size:13.5px; margin-top:6px; } .desc .num { display:none; }
  .nav-case { bottom:calc(env(safe-area-inset-bottom) + 2.2vh); flex-direction:row; gap:10px; font-size:12.5px; }
  .nav-case br { display:none; }
  .nav-case .c { width:42px; height:42px; } .nav-case svg { width:20px; height:20px; }
  .prev { left:6vw; } .next { right:6vw; flex-direction:row-reverse; }
  .hint { bottom:18px; font-size:11px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="hero" id="hero">
    <svg class="wm pre" id="wm" viewBox="0 0 1440 250" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#f1f3ea" stop-opacity=".9"/><stop offset="1" stop-color="#dbe0cf" stop-opacity=".22"/></linearGradient></defs>
      <text x="10" y="215" textLength="1420" lengthAdjust="spacingAndGlyphs" fill="url(#g)">NGUYỄN KHOA</text>
    </svg>
    <img class="me pre" id="me" src="images/khoa-cut.webp" alt="Nguyễn Khoa" width="800" height="1004" decoding="async">
    <div class="script pre" id="script">graphic design</div>
    <div class="badge pre" id="badge">
      <div class="strap"></div><div class="clip"></div>
      <div class="card" id="card">
        <h4>DESIGNER<br>CARD</h4><span class="yr">2026</span>
        <div class="role">GRAPHIC DESIGNER // VIDEO EDITOR</div>
        <img class="ph" src="images/khoa-avatar.png" alt="">
        <div class="row"><span>TÊN</span><b>NGUYỄN KHOA</b></div>
        <div class="row"><span>MẢNG</span><b>THƯƠNG HIỆU · VIDEO</b></div>
        <div class="row"><span>NƠI Ở</span><b>TP.HCM</b></div>
        <div class="row"><span>EMAIL</span><b>KHNSZ878@GMAIL.COM</b></div>
      </div>
    </div>
  </div>
  <div class="laptop" id="laptop">
    <div class="lid"><div class="screen" id="screen"><div class="flash" id="flash"></div></div><div class="screen-hit" id="hit" title="Dự án tiếp theo"></div></div>
    <div class="base"></div>
  </div>
</div>

<div class="ui">
  <button class="tag t1 pre" id="toHome">giới thiệu</button>
  <button class="tag t2 pre lime" id="toWork">dự án</button>
  <a class="tag t3 pre" href="index.html#kinh-nghiem">kinh nghiệm</a>
  <a class="tag t4 pre" href="mailto:khnsz878@gmail.com">liên hệ</a>
  <button class="logo" id="logo">NK<span>.</span></button>
  <div class="hint pre" id="hint"><i></i>cuộn để xem dự án</div>
  <div class="ticket" id="ticket"><span class="hole h1"></span><span class="hole h2"></span><span class="hole h3"></span><span class="hole h4"></span>
    <h2 id="tTitle"></h2><div class="rows" id="tRows"></div><a class="go" id="tGo" href="index.html">Xem cả dự án →</a></div>
  <div class="desc" id="desc"><div class="k" id="dKey"></div><p id="dText"></p><div class="num" id="dNum"></div></div>
  <button class="nav-case prev" id="prev"><span class="c"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span><span>dự án <br>trước</span></button>
  <button class="nav-case next" id="next"><span class="c"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><span>dự án <br>tiếp</span></button>
</div>

<script>
document.documentElement.classList.add('js');
const $ = id => document.getElementById(id);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches, T = ms => RM ? 0 : ms;
const EASE = 'cubic-bezier(.2,.8,.2,1)', IN = 'cubic-bezier(.5,0,.75,0)';
const anim = (el, kf, o) => el.animate(kf, { duration:T(o.d), delay:T(o.delay || 0), easing:o.e || EASE, fill:o.fill || 'both', composite:o.comp });
const mob = () => innerWidth <= 820;
let cases = [], vids = [], cur = 0, mode = 'hero', busy = false, sway;

function fitUnits() {
  const W = innerWidth, H = innerHeight;
  document.documentElement.style.setProperty('--n', mob() ? (W / 430) + 'px' : Math.min(W / 1440, H / 900) + 'px');
  // laptop: vừa khoảng giữa phiếu và mép; điện thoại: dưới phần chữ
  const lw = mob() ? Math.min(W - 28, (H * .42) * 16 / 9 * .92) : Math.min(W * .5, (H - 170) * 16 / 9 * .9);
  document.documentElement.style.setProperty('--lw', lw + 'px');
  if (mob()) document.documentElement.style.setProperty('--th', $('ticket').offsetHeight + 'px');
  const lap = $('laptop');
  lap.style.top = mob() ? 'auto' : '50%';
  lap.style.bottom = mob() ? `calc(env(safe-area-inset-bottom) + 2.2vh + 58px)` : 'auto';
  lap.style.transform = mob() ? 'translateX(-50%)' : 'translate(-50%, -46%)';
}
addEventListener('resize', fitUnits); fitUnits();

// Dữ liệu dự án thật: mục showcase (6 job đẹp) trong content.json
fetch('content.json?t=' + Date.now()).then(r => r.json()).then(C => {
  const by = s => C.projects.find(p => p.slug === s && !p.hidden);
  cases = (C.showcase || C.featured || []).map(by).filter(Boolean);
  vids = cases.map(p => {
    let m;
    if (p.video) { m = document.createElement('video'); m.muted = true; m.loop = true; m.playsInline = true; m.preload = 'none'; m.poster = p.bannerImage || ''; m.src = p.video; }
    else { m = document.createElement('img'); m.src = p.bannerImage || (p.images[p.cover || 0] || {}).src || ''; m.alt = ''; }
    $('screen').insertBefore(m, $('flash')); return m;
  });
  if (location.hash === '#du-an') setTimeout(toCase, T(600)); // link thẳng vào phần dự án
}).catch(() => { $('hint').lastChild.textContent = 'không tải được dự án'; });

// Vào trang
function entrance() {
  if (document.body.dataset.in) return; document.body.dataset.in = 1;
  document.querySelectorAll('.tag').forEach((t, i) => anim(t, [{ opacity:0, transform:'translateY(-40px) rotate(-4deg)' }, { opacity:1, transform:'none' }], { d:700, delay:120 + i * 80, e:'cubic-bezier(.3,1.5,.5,1)' }));
  anim($('wm'), [{ opacity:0, transform:'translateY(60px)', clipPath:'inset(100% 0 0 0)' }, { opacity:1, transform:'none', clipPath:'inset(0)' }], { d:1100, delay:260 });
  anim($('me'), [{ opacity:0, transform:'translateX(-46%) translateY(40px)' }, { opacity:1, transform:'translateX(-46%) translateY(0)' }], { d:900, delay:420 });
  anim($('script'), [{ opacity:0, clipPath:'inset(0 100% 0 0)' }, { opacity:1, clipPath:'inset(0)' }], { d:900, delay:1050, e:'cubic-bezier(.5,0,.3,1)' });
  anim($('badge'), [{ opacity:0, transform:'translateY(-120%) rotate(8deg)' }, { opacity:1, transform:'translateY(0) rotate(-3deg)', offset:.6 }, { transform:'rotate(1.6deg)', offset:.8 }, { opacity:1, transform:'rotate(0)' }], { d:1500, delay:700 }).finished.then(startSway);
  anim($('hint'), [{ opacity:0 }, { opacity:.9 }], { d:600, delay:1800 });
}
function startSway() { if (RM || mode !== 'hero') return; sway = $('badge').animate([{ transform:'rotate(-1.1deg)' }, { transform:'rotate(1.1deg)' }], { duration:3200, iterations:Infinity, direction:'alternate', easing:'ease-in-out', composite:'add' }); }
$('card').addEventListener('pointerenter', () => { if (!RM && mode === 'hero') $('badge').animate([{ transform:'rotate(0)' }, { transform:'rotate(-6deg)' }, { transform:'rotate(4deg)' }, { transform:'rotate(-2deg)' }, { transform:'rotate(0)' }], { duration:1400, easing:'ease-out', composite:'add' }); });
Promise.race([Promise.all([document.fonts.ready, $('me').decode().catch(() => {})]), new Promise(r => setTimeout(r, 2500))]).then(() => requestAnimationFrame(entrance));
setTimeout(entrance, 4000);
const wait = ms => new Promise(r => setTimeout(r, T(ms)));

// Hero → laptop: máy quay đẩy vào người, laptop nổi lên giữa màn hình
async function toCase() {
  if (busy || mode !== 'hero' || !cases.length) return; busy = true; document.body.classList.add('busy');
  if (sway) sway.cancel();
  anim($('wm'), [{ opacity:1, transform:'none' }, { opacity:0, transform:'translateY(-40px)' }], { d:380, e:IN, fill:'forwards' });
  anim($('script'), [{ opacity:1 }, { opacity:0 }], { d:300, e:IN, fill:'forwards' });
  anim($('badge'), [{ opacity:1, transform:'none' }, { opacity:0, transform:'translateY(-110%) rotate(-6deg)' }], { d:380, e:IN, fill:'forwards' });
  await wait(250);
  anim($('hero'), [{ transform:'scale(1)', filter:'blur(0)', opacity:1 }, { transform:'scale(1.9)', filter:'blur(14px)', opacity:0 }], { d:1000, e:'cubic-bezier(.65,0,.35,1)', fill:'forwards' });
  document.querySelector('.stage').classList.add('m-case'); document.body.classList.add('is-case');
  const base = getComputedStyle($('laptop')).transform === 'none' ? '' : $('laptop').style.transform;
  anim($('laptop'), [{ opacity:0, transform:base + ' translateY(30%) scale(.55) rotateX(28deg)' }, { opacity:1, transform:base + ' translateY(0) scale(1) rotateX(0)' }], { d:1100, delay:200, e:'cubic-bezier(.2,.8,.2,1)', fill:'forwards' });
  await wait(1000);
  mode = 'case'; fitUnits();
  anim($('flash'), [{ opacity:0 }, { opacity:.55 }, { opacity:0 }], { d:600, e:'ease-out' });
  show(0, true);
  await wait(700); busy = false; document.body.classList.remove('busy');
}

function playOnly(i) { vids.forEach((v, k) => { if (v.tagName === 'VIDEO') { if (k === i) { v.currentTime = 0; v.play().catch(() => {}); } else v.pause(); } }); }
function fill(i) {
  const p = cases[i];
  $('tTitle').textContent = p.title;
  $('tRows').replaceChildren(...[p.brand, (p.scope || []).slice(0, 3).join(' · '), p.images.length + ' thiết kế'].map(t => { const d = document.createElement('div'); d.textContent = t; return d; }));
  $('tGo').href = 'index.html#da-' + p.slug;
  $('dKey').textContent = '// ' + p.slug.replace(/-/g, ' ');
  $('dText').textContent = '— ' + p.description;
  $('dNum').textContent = String(i + 1).padStart(2, '0') + ' / ' + String(cases.length).padStart(2, '0');
  $('prev').classList.toggle('dim', i === 0);
  if (mob()) document.documentElement.style.setProperty('--th', $('ticket').offsetHeight + 'px');
}
function caseIn(first) {
  anim($('ticket'), [{ opacity:0, transform:'translateY(-60px) rotate(-6deg)' }, { opacity:1, transform:'translateY(6px) rotate(1.2deg)', offset:.7 }, { opacity:1, transform:'none' }], { d:800, delay:first ? 150 : 0 });
  [...$('desc').children].forEach((c, k) => anim(c, [{ opacity:0, transform:'translateY(14px)' }, { opacity:1, transform:'none' }], { d:600, delay:(first ? 250 : 80) + k * 70 }));
}
function caseOut() {
  const a = anim($('ticket'), [{ opacity:1, transform:'none' }, { opacity:0, transform:'translateY(-40px) rotate(4deg)' }], { d:380, e:IN, fill:'forwards' });
  [...$('desc').children].forEach((c, k) => anim(c, [{ opacity:1, transform:'none' }, { opacity:0, transform:'translateY(-10px)' }], { d:300, delay:k * 40, e:IN, fill:'forwards' }));
  return a.finished;
}
function show(i, first) {
  cur = i; fill(i);
  anim(vids[i], [{ opacity:0, transform:'scale(1.06)' }, { opacity:1, transform:'scale(1)' }], { d:first ? 700 : 500 });
  playOnly(i); caseIn(first);
  const nx = vids[(i + 1) % vids.length]; if (nx && nx.tagName === 'VIDEO') nx.preload = 'auto';
}
async function swapTo(n) {
  if (busy || mode !== 'case') return; busy = true;
  const old = vids[cur];
  await Promise.all([caseOut(), anim(old, [{ opacity:1 }, { opacity:0 }], { d:350, fill:'forwards' }).finished]);
  if (old.pause) old.pause();
  anim($('flash'), [{ opacity:0 }, { opacity:.35 }, { opacity:0 }], { d:420, e:'ease-out' });
  show(n, false);
  await wait(520); busy = false;
}
const next = () => swapTo((cur + 1) % cases.length);
const prev = () => cur === 0 ? toHero() : swapTo(cur - 1);

async function toHero() {
  if (busy || mode !== 'case') return; busy = true;
  caseOut(); vids.forEach(v => v.pause && v.pause());
  anim($('laptop'), [{ opacity:1 }, { opacity:0, transform:$('laptop').style.transform + ' translateY(25%) scale(.7)' }], { d:600, e:IN, fill:'forwards' });
  document.body.classList.remove('is-case'); document.querySelector('.stage').classList.remove('m-case');
  anim($('hero'), [{ transform:'scale(1.12)', filter:'blur(8px)', opacity:0 }, { transform:'scale(1)', filter:'blur(0)', opacity:1 }], { d:900, delay:150, fill:'forwards' });
  vids[cur].getAnimations().forEach(a => a.cancel()); vids[cur].style.opacity = 0;
  await wait(250);
  anim($('wm'), [{ opacity:0, transform:'translateY(40px)' }, { opacity:1, transform:'none' }], { d:700, fill:'forwards' });
  anim($('script'), [{ opacity:0, clipPath:'inset(0 100% 0 0)' }, { opacity:1, clipPath:'inset(0)' }], { d:700, delay:250, fill:'forwards' });
  mode = 'hero';
  anim($('badge'), [{ opacity:0, transform:'translateY(-110%) rotate(6deg)' }, { opacity:1, transform:'translateY(0) rotate(-2deg)', offset:.7 }, { opacity:1, transform:'rotate(0)' }], { d:1100, fill:'forwards' }).finished.then(startSway);
  await wait(1000); busy = false; document.body.classList.remove('busy');
}

// Điều khiển: lăn chuột, vuốt, phím, bấm
$('toWork').onclick = () => mode === 'hero' ? toCase() : null;
$('toHome').onclick = $('logo').onclick = toHero;
$('next').onclick = next; $('prev').onclick = prev; $('hit').onclick = next;
let lock = 0;
addEventListener('wheel', e => {
  e.preventDefault();
  if (Math.abs(e.deltaY) < 18 || Date.now() < lock) return; lock = Date.now() + 900;
  if (mode === 'hero') { if (e.deltaY > 0) toCase(); } else (e.deltaY > 0 ? next : prev)();
}, { passive:false });
let tx = 0, ty = 0;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive:true });
addEventListener('touchmove', e => e.preventDefault(), { passive:false });
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 40) return;
  const fwd = Math.abs(dy) >= Math.abs(dx) ? dy < 0 : dx < 0;
  if (mode === 'hero') { if (fwd) toCase(); } else (fwd ? next : prev)();
});
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('a, button') && (e.key === ' ' || e.key === 'Enter')) return; // để nút tự xử lý
  const f = ['ArrowDown', 'PageDown', ' ', 'ArrowRight'].includes(e.key), b = ['ArrowUp', 'PageUp', 'ArrowLeft'].includes(e.key);
  if (!f && !b) return; e.preventDefault();
  if (mode === 'hero') { if (f && e.key !== 'ArrowRight') toCase(); } else (f ? next : prev)();
});
</script>
