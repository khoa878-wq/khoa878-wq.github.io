<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Portfolio của Nguyễn Khoa, graphic designer tại TP.HCM.">
<title>Portfolio Nguyễn Khoa</title>
<style>
/* Bố cục: một hệ khung duy nhất. Thẻ dự án 16:10, trang chi tiết dùng chung đầu trang + thư viện khung đều + điều hướng dự án. */
:root { color-scheme: dark; --bg:#171815; --panel:#252620; --panel-2:#1d1e1a; --line:#41433a; --ink:#f6f4e9; --muted:#c2c0b2; --lime:#dbfa76; --paper:#eae8db; --paper-ink:#22241c; font-family:system-ui,"Segoe UI",sans-serif; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); line-height:1.55; }
body:has(dialog[open]) { overflow:hidden; }
a { color:inherit; text-decoration:none; }
button { font:inherit; cursor:pointer; }
img { max-width:100%; }
a:focus-visible, button:focus-visible { outline:3px solid var(--lime); outline-offset:4px; }
h2[tabindex]:focus { outline:none; }
[hidden] { display:none !important; }
.wrap { width:min(1200px,calc(100% - 64px)); margin-inline:auto; }
.top,.foot { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:20px; }
.top { border-bottom:1px solid var(--line); }
.brand { font-size:1.65rem; font-weight:900; letter-spacing:-.09em; }
.brand span,h1 span { color:var(--lime); }
nav { display:flex; gap:clamp(12px,3vw,34px); font-size:.9rem; }
nav a:hover,.foot a:hover { text-decoration:underline; }
h1,h2,h3,p { margin:0; }
h2 { font-size:clamp(2rem,5vw,4.2rem); line-height:1.02; letter-spacing:-.06em; text-wrap:balance; }
.label { color:var(--lime); font-size:.9rem; font-weight:650; }

/* Giới thiệu */
.hero { display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:42px; padding-block:60px 82px; }
h1 { font-size:clamp(4rem,11vw,9rem); line-height:.88; letter-spacing:-.09em; margin-block:20px; }
.intro { max-width:34ch; color:var(--muted); font-size:1.15rem; }
.stats { display:flex; gap:28px; margin-top:22px; font-size:.9rem; color:var(--muted); }
.stats b { display:block; color:var(--ink); font-size:1.6rem; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
.action { display:inline-block; margin-top:26px; background:var(--lime); color:var(--bg); font-weight:750; padding:11px 22px; border-radius:99px; }
.action:hover { background:var(--ink); }
.reel { aspect-ratio:16/9; border-radius:6px; overflow:hidden; background:var(--panel); border:1px solid var(--line); }
.reel video, .case-reel video { width:100%; height:100%; object-fit:cover; display:block; }
.case-reel { aspect-ratio:16/9; max-width:960px; margin-top:30px; border-radius:6px; overflow:hidden; background:var(--panel-2); border:1px solid var(--line); }
/* Dự án tiêu biểu: 2 cột so le */
.featured { padding-bottom:72px; }
.feat-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:26px; align-items:start; }
.feat-grid > :nth-child(even) { margin-top:72px; }
.feat { position:relative; display:block; overflow:hidden; border-radius:6px; background:var(--panel); border:1px solid var(--line); }
.feat img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; transition:transform .6s ease; }
.feat:nth-child(4n+1) img, .feat:nth-child(4n+4) img { aspect-ratio:4/5; }
.feat:hover img { transform:scale(1.03); }
.feat:hover { border-color:var(--lime); }
.feat-copy { position:absolute; inset:auto 0 0 0; padding:56px 18px 16px; background:linear-gradient(transparent, #0e0f0cee); display:grid; gap:2px; }
.feat-copy small { color:var(--muted); font-size:.85rem; }
.feat-copy strong { font-size:clamp(1.15rem,2.2vw,1.6rem); line-height:1.2; letter-spacing:-.02em; }
.feat-copy span { color:var(--lime); font-size:.88rem; margin-top:4px; }
.feat .tools { position:absolute; top:8px; right:8px; }
.feat.has-banner img, .feat.has-banner:nth-child(n) img { aspect-ratio:16/9; }
.feat-go { position:absolute; right:14px; bottom:14px; background:#0e0f0cd9; color:var(--lime); font-size:.88rem; font-weight:650; padding:6px 14px; border-radius:99px; }
.case-banner { margin-top:22px; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:var(--panel-2); }
.case-banner img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; }
/* Trước -> Sau */
.compare-wrap { margin-top:34px; }
.compare-wrap h3 { font-size:1.3rem; letter-spacing:-.02em; }
.compare-wrap > p { color:var(--muted); margin-top:4px; }
.compare { --pos:50%; position:relative; aspect-ratio:16/9; max-width:960px; margin-top:14px; overflow:hidden; border-radius:6px; border:1px solid var(--line); background:var(--panel-2); user-select:none; touch-action:pan-y; }
.compare img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; }
.compare .before { clip-path:inset(0 calc(100% - var(--pos)) 0 0); background:var(--panel-2); }
.compare .bar { position:absolute; top:0; bottom:0; left:var(--pos); width:2px; margin-left:-1px; background:var(--lime); pointer-events:none; }
.compare .bar::after { content:'\21C6'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:40px; height:40px; border-radius:50%; background:var(--lime); color:var(--bg); display:grid; place-items:center; font-weight:800; }
.compare .tag { position:absolute; top:10px; padding:3px 10px; border-radius:99px; background:#0e0f0ccc; font-size:.82rem; pointer-events:none; }
.compare .tag.l { left:10px; } .compare .tag.r { right:10px; }
.compare input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:ew-resize; margin:0; }
.compare input:focus-visible ~ .bar::after { outline:3px solid var(--ink); }
@media(max-width:630px) { .feat-grid { grid-template-columns:1fr; } .feat-grid > :nth-child(even) { margin-top:0; } .feat img, .feat:nth-child(4n+1) img, .feat:nth-child(4n+4) img { aspect-ratio:4/3; } }
.mosaic { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.mosaic a { display:block; aspect-ratio:1; overflow:hidden; border-radius:4px; background:var(--panel); }
.mosaic img { width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
.mosaic a:hover img { transform:scale(1.04); }

/* Lưới dự án */
.projects { padding-bottom:72px; }
.section-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.count { color:var(--muted); font-variant-numeric:tabular-nums; }
.filters { display:flex; flex-wrap:wrap; gap:8px; margin:23px 0; }
.filters button { border:1px solid #77796b; background:transparent; border-radius:99px; color:var(--ink); padding:7px 15px; min-height:44px; }
.filters button[aria-pressed=true] { background:var(--lime); color:var(--bg); border-color:var(--lime); font-weight:700; }
.grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
.card { display:grid; grid-template-rows:auto 1fr; background:var(--panel); border:1px solid var(--line); border-radius:5px; overflow:hidden; }
.card:hover { border-color:var(--lime); }
.art { aspect-ratio:16/10; display:grid; place-items:center; padding:20px; overflow:hidden; position:relative; background:var(--card-bg); color:var(--card-ink); }
.art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:var(--panel-2); transition:transform .5s ease; }
.card:hover .art img { transform:scale(1.03); }
.art b { font-size:clamp(2rem,5.6vw,5.5rem); font-weight:900; line-height:.95; letter-spacing:-.09em; overflow-wrap:anywhere; }
.card-copy { display:grid; align-content:start; padding:16px; gap:3px; }
.card-copy small { color:var(--muted); font-size:.88rem; }
.card-copy strong { font-size:1.17rem; line-height:1.28; }
.card-copy .meta { display:flex; justify-content:space-between; gap:8px; margin-top:6px; }

/* Kinh nghiệm + kỹ năng */
.lower { background:var(--paper); color:var(--paper-ink); }
.details { display:grid; grid-template-columns:1.35fr 1fr; gap:70px; padding-block:64px; }
.history,.skills { list-style:none; margin:24px 0 0; padding:0; }
.history li,.skills dt { border-top:1px solid #a8a99c; padding-top:12px; }
.history li { padding-bottom:14px; }
.history time { font-size:.875rem; }
.history h3,.skills dt { font-weight:750; }
.history a { display:inline-block; text-decoration:underline; margin-top:5px; }
.history a:focus-visible { outline-color:var(--paper-ink); }
.skills dd { margin:2px 0 14px; }
.me { margin:24px 0 0; max-width:340px; border-radius:8px; overflow:hidden; border:1px solid #a8a99c; }
.me img { display:block; width:100%; height:auto; aspect-ratio:4/5; object-fit:cover; object-position:50% 30%; }
.history .role { font-weight:600; color:#4a4b40; margin-top:1px; }
h2.sub { margin-top:42px; font-size:clamp(1.5rem, 2.6vw, 2.1rem); }
.goal { margin-top:16px; border-top:1px solid #a8a99c; padding-top:12px; line-height:1.6; }
.foot { flex-wrap:wrap; }
.contact { display:flex; flex-wrap:wrap; gap:8px 24px; }
.contact a { color:var(--lime); text-decoration:underline; }

/* Trang chi tiết dự án: cùng một khung cho mọi dự án */
.case { padding-block:28px 72px; }
.back { display:inline-flex; align-items:center; gap:8px; border:1px solid #77796b; border-radius:99px; background:none; color:var(--ink); padding:8px 16px; min-height:44px; }
.back:hover { border-color:var(--lime); }
.case-head { display:grid; grid-template-columns:1.4fr 1fr; gap:48px; padding-block:34px 30px; border-bottom:1px solid var(--line); }
.case-head h2 { margin-top:10px; }
.case-desc { color:var(--muted); font-size:1.08rem; max-width:62ch; margin-top:16px; }
.case-meta { display:grid; gap:18px; align-content:start; }
.case-meta dt { color:var(--muted); font-size:.82rem; text-transform:uppercase; letter-spacing:.08em; }
.case-meta dd { margin:4px 0 0; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips span { border:1px solid var(--line); border-radius:99px; padding:3px 11px; font-size:.86rem; }
.case-meta a { color:var(--lime); text-decoration:underline; }
.gallery { display:grid; grid-template-columns:repeat(var(--cols,3),minmax(0,1fr)); gap:14px; margin-top:30px; }
.shot { display:grid; gap:6px; padding:0; border:0; background:none; color:var(--muted); text-align:left; }
.frame { aspect-ratio:var(--ratio); display:grid; place-items:center; overflow:hidden; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; max-width:100%; }
.frame img { width:100%; height:100%; object-fit:contain; }
.shot:hover .frame { border-color:var(--lime); }
.shot small { font-size:.8rem; font-variant-numeric:tabular-nums; }
.empty { margin-top:30px; padding:40px 24px; border:1px dashed #77796b; border-radius:6px; color:var(--muted); text-align:center; }
.case-nav { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:48px; border-top:1px solid var(--line); padding-top:24px; }
.case-nav a { display:grid; gap:2px; padding:14px 0; }
.case-nav a:last-child { text-align:right; }
.case-nav small { color:var(--muted); }
.case-nav strong { font-size:1.2rem; }
.case-nav a:hover strong { color:var(--lime); }

/* Xem ảnh lớn */
.viewer { width:100%; height:100%; max-width:none; max-height:none; margin:0; padding:0; border:0; background:#0e0f0cf2; color:var(--ink); }
.viewer::backdrop { background:#000c; }
.viewer[open] { display:grid; grid-template-rows:auto 1fr auto; }
.viewer-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.viewer-bar span { color:var(--muted); font-variant-numeric:tabular-nums; }
.viewer-stage { display:grid; place-items:center; min-height:0; padding:0 64px; }
.viewer-stage img { max-width:100%; max-height:100%; object-fit:contain; }
.viewer-ctrl { display:flex; justify-content:center; gap:12px; padding:12px 16px 20px; }
.icon-btn { min-width:44px; min-height:44px; border:1px solid #77796b; border-radius:99px; background:none; color:var(--ink); padding:6px 16px; }
.icon-btn:hover { border-color:var(--lime); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }

@media(max-width:870px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .gallery { --cols:2 !important; } .case-head { grid-template-columns:1fr; gap:24px; } }
@media(max-width:630px) { .wrap { width:calc(100% - 32px); } .hero,.details { grid-template-columns:1fr; gap:24px; } .hero { padding-block:38px 54px; } .grid { grid-template-columns:1fr; } .art b { font-size:3.5rem; } .details { padding-block:42px; gap:40px; } .gallery { --cols:1 !important; } .viewer-stage { padding:0 8px; } .case-nav strong { font-size:1rem; } }
@media(prefers-reduced-motion:reduce) { * { transition:none !important; } }
/* Chế độ sửa (chỉ hiện khi link có ?sua) */
.ed { outline:1px dashed color-mix(in srgb, currentColor 45%, transparent); outline-offset:3px; border-radius:2px; cursor:text; }
.ed:hover, .ed:focus { outline:2px solid var(--lime); }
.lower .ed:hover, .lower .ed:focus { outline-color:#5d7a00; }
.ed:empty::before { content:attr(data-ph); opacity:.5; }
.editbar { position:fixed; inset:auto 0 0 0; z-index:50; display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:10px max(16px, env(safe-area-inset-left, 0px)); background:#0e0f0c; border-top:2px solid var(--lime); color:var(--ink); font-size:.9rem; }
.editbar b { color:var(--lime); }
.editbar .grow { flex:1; min-width:160px; color:var(--muted); }
.editbar button, .tool, .tools button { border:1px solid #77796b; background:var(--panel); color:var(--ink); border-radius:99px; padding:6px 14px; min-height:36px; }
.editbar button.primary { background:var(--lime); color:var(--bg); border-color:var(--lime); font-weight:750; }
.editbar button:disabled { opacity:.45; cursor:default; }
body.editing { padding-bottom:84px; }
.tools { display:flex; flex-wrap:wrap; gap:6px; }
.tools button { padding:3px 10px; min-height:30px; font-size:.82rem; }
.card { position:relative; }
.card .tools { position:absolute; top:8px; right:8px; z-index:2; }
.card.is-hidden { opacity:.5; }
.badge { display:inline-block; background:#ff8a65; color:#2a0e05; font-weight:750; font-size:.78rem; border-radius:99px; padding:2px 9px; }
.card .badge { position:absolute; top:10px; left:10px; z-index:2; }
.history li .tools, .skills .tools { margin-top:6px; }
.history li .tools button, .skills .tools button { background:transparent; color:var(--paper-ink); border-color:#8a8b7e; }
.lower .tool { background:transparent; color:var(--paper-ink); border-color:#8a8b7e; margin-top:12px; }
.edit-box { display:grid; gap:10px; margin-top:16px; padding:14px; border:1px dashed var(--line); border-radius:6px; }
.edit-box label { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.edit-box input[type=text], .edit-box input[type=url] { flex:1; min-width:180px; background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:6px 8px; font:inherit; }
.checks { display:flex; flex-wrap:wrap; gap:6px 14px; }
.shot-edit { display:grid; gap:6px; }
.shot-edit .frame { cursor:zoom-in; }
.shot-edit.is-cover .frame { border:2px solid var(--lime); }
.add-shot { display:grid; place-items:center; aspect-ratio:var(--ratio); border:1px dashed #77796b; border-radius:4px; color:var(--muted); background:none; }
.add-shot:hover { border-color:var(--lime); color:var(--ink); }
.token-dlg { max-width:560px; width:calc(100% - 32px); border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); padding:22px; }
.token-dlg::backdrop { background:#000a; }
.token-dlg ol { padding-left:20px; color:var(--muted); }
.token-dlg a { color:var(--lime); text-decoration:underline; }
.token-dlg input { width:100%; margin:10px 0; background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:8px; font:inherit; }
.token-dlg .row { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
.token-dlg button { border:1px solid #77796b; background:none; color:var(--ink); border-radius:99px; padding:7px 16px; }
.token-dlg button.primary { background:var(--lime); color:var(--bg); border-color:var(--lime); font-weight:750; }
@media(max-width:630px) { .editbar { gap:6px; padding:8px 10px; font-size:.8rem; } .editbar .grow { flex-basis:100%; order:-1; } .editbar > b { display:none; } .editbar button { padding:4px 10px; min-height:32px; font-size:.8rem; } body.editing { padding-bottom:130px; } }
</style>
</head>
<body>
<header class="top wrap"><a class="brand" href="#gioi-thieu" aria-label="Nguyễn Khoa, đầu trang">NK<span>.</span></a><nav aria-label="Điều hướng chính"><a href="#du-an">Dự án</a><a href="#kinh-nghiem">Kinh nghiệm</a><a href="#ky-nang">Kỹ năng</a></nav></header>
<main id="home">
<section class="hero wrap" id="gioi-thieu">
  <div><p class="label" id="site-label"></p><h1>Nguyễn<br>Khoa<span>.</span></h1><p class="intro" id="site-intro"></p>
  <div class="stats"><div><b id="stat-projects">–</b>dự án</div><div><b id="stat-images">–</b>thiết kế</div><div><b id="stat-period"></b>giai đoạn</div></div>
  <a class="action" href="#du-an">Xem dự án</a></div>
  <div class="reel"><video id="reel" muted loop playsinline preload="metadata" poster="video/showreel.jpg" aria-label="Video giới thiệu các dự án"><source src="video/showreel.mp4" type="video/mp4"></video></div>
</section>
<section class="featured wrap" id="tieu-bieu" hidden>
  <div class="section-head"><h2>Dự án tiêu biểu</h2></div>
  <div class="feat-grid" id="featured"></div>
</section>
<section class="projects wrap" id="du-an">
  <div class="section-head"><h2>Dự án</h2><span class="count" id="result" role="status"></span></div>
  <div class="filters" role="group" aria-label="Lọc dự án"></div>
  <div class="grid" id="cards"></div>
</section>
<div class="lower"><div class="wrap details">
<section id="kinh-nghiem"><h2>Kinh nghiệm</h2><figure class="me"><img src="images/khoa.jpg" alt="Nguyễn Khoa tại nơi làm việc" width="1000" height="1256" loading="lazy" decoding="async"></figure><ul class="history" id="history"></ul></section>
<section id="ky-nang"><h2>Kỹ năng</h2><dl class="skills" id="skills"></dl>
<h2 class="sub">Học vấn</h2><ul class="history" id="education"></ul>
<h2 class="sub">Mục tiêu nghề nghiệp</h2><p class="goal" id="site-goal"></p></section>
</div></div>
</main>

<section id="case" class="case wrap" hidden aria-live="polite"></section>

<footer class="wrap foot"><strong>Nguyễn Khoa</strong><span class="contact"><span id="site-email"></span><a id="site-behance" target="_blank" rel="noopener noreferrer" href="https://www.behance.net/khoangy2">Behance ↗</a></span></footer>

<dialog class="viewer" id="viewer" aria-label="Xem ảnh lớn">
  <div class="viewer-bar"><span id="viewer-count"></span><button class="icon-btn" id="viewer-close" type="button" aria-label="Đóng">Đóng ×</button></div>
  <div class="viewer-stage"><img id="viewer-img" alt=""></div>
  <div class="viewer-ctrl"><button class="icon-btn" id="viewer-prev" type="button">← Trước</button><button class="icon-btn" id="viewer-next" type="button">Sau →</button></div>

<script>
const REPO = 'khoa878-wq/khoa878-wq.github.io', BRANCH = 'main';
const EDIT = new URLSearchParams(location.search).has('sua');
let C = JSON.parse(document.getElementById('content-data').textContent);
const $ = s => document.querySelector(s);
const filters = $('.filters'), cards = $('#cards'), home = $('#home'), caseView = $('#case');
const viewer = $('#viewer'), viewerImg = $('#viewer-img'), viewerCount = $('#viewer-count');
let viewing = { list:[], index:0, title:'' };
let activeGroup = 'Tất cả';

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (className) node.className = className;
  return node;
}
const shown = () => EDIT ? C.projects : C.projects.filter(p => !p.hidden);
const imgSrc = item => item._preview || item.src;
function coverSrc(p) { return p.images && p.images.length ? imgSrc(p.images[Math.min(p.cover || 0, p.images.length - 1)]) : null; }

/* ---------- Sửa chữ tại chỗ ---------- */
function editable(node, get, set, opts = {}) {
  node.textContent = get() || '';
  if (!EDIT || node.dataset.bound) return node;
  node.dataset.bound = '1';
  try { node.contentEditable = 'plaintext-only'; } catch { node.contentEditable = 'true'; }
  node.spellcheck = false;
  node.classList.add('ed');
  node.dataset.ph = opts.ph || 'Bấm để nhập…';
  node.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' && !opts.multiline) { e.preventDefault(); node.blur(); } });
  node.addEventListener('input', () => { set(node.innerText.replace(/ /g, ' ').trim()); changed(false); });
  return node;
}
function toolBtn(label, title, fn) { const b = el('button', label); b.type = 'button'; b.title = title; b.setAttribute('aria-label', title); b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); fn(); }); return b; }
function move(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }

/* ---------- Phần đầu, kinh nghiệm, kỹ năng ---------- */
function renderSite() {
  editable($('#site-label'), () => C.site.label, v => C.site.label = v);
  editable($('#site-intro'), () => C.site.intro, v => C.site.intro = v, { multiline:true });
  editable($('#site-goal'), () => C.site.goal, v => C.site.goal = v, { multiline:true, ph:'Mục tiêu nghề nghiệp' });
  editable($('#stat-period'), () => C.site.period, v => C.site.period = v);
  editable($('#site-email'), () => C.site.email, v => C.site.email = v);
  $('#site-behance').href = C.site.behance;
  const vis = shown().filter(p => !p.hidden);
  $('#stat-projects').textContent = vis.length;
  $('#stat-images').textContent = vis.reduce((n, p) => n + (p.images || []).length, 0);
  if ($('#mosaic')) $('#mosaic').replaceChildren(...C.mosaic.map(slug => C.projects.find(x => x.slug === slug && !x.hidden)).filter(Boolean).map(p => {
    const a = el('a'); a.href = '#da-' + p.slug; a.setAttribute('aria-label', p.title);
    const img = el('img'); img.src = coverSrc(p) || ''; img.alt = ''; a.append(img); return a;
  }));
}

function renderHistory() {
  const ul = $('#history');
  ul.replaceChildren(...C.experience.map((x, i) => {
    const li = el('li');
    li.append(editable(el('time'), () => x.time, v => x.time = v, { ph:'Thời gian' }),
      editable(el('h3'), () => x.title, v => x.title = v, { ph:'Nơi làm việc' }));
    if (x.role || EDIT) li.append(editable(el('p', '', 'role'), () => x.role, v => x.role = v, { ph:'Chức danh' }));
    li.append(      editable(el('p'), () => x.text, v => x.text = v, { multiline:true, ph:'Mô tả công việc' }));
    if (x.link || EDIT) {
      const a = el('a'); a.target = '_blank'; a.rel = 'noopener noreferrer'; a.href = x.link || '#';
      editable(a, () => x.linkText, v => x.linkText = v, { ph:'Tên link (để trống nếu không có)' });
      if (x.link || x.linkText || EDIT) li.append(a);
    }
    if (EDIT) {
      const t = el('div', '', 'tools');
      t.append(toolBtn('↑', 'Đưa lên', () => { move(C.experience, i, -1); changed(); }),
        toolBtn('↓', 'Đưa xuống', () => { move(C.experience, i, 1); changed(); }),
        toolBtn('Sửa địa chỉ link', 'Sửa địa chỉ link', () => { const v = prompt('Địa chỉ link (để trống để bỏ link):', x.link || ''); if (v !== null) { x.link = v.trim(); changed(); } }),
        toolBtn('Xoá', 'Xoá mục này', () => { if (confirm('Xoá mục "' + x.title + '"?')) { C.experience.splice(i, 1); changed(); } }));
      li.append(t);
    }
    return li;
  }));
  if (EDIT) { const b = toolBtn('+ Thêm kinh nghiệm', 'Thêm kinh nghiệm', () => { C.experience.unshift({ time:'', title:'', text:'', link:'', linkText:'' }); changed(); }); b.className = 'tool'; ul.append(b); }
}

function renderEducation() {
  C.education = C.education || [];
  const ul = $('#education');
  ul.replaceChildren(...C.education.map((x, i) => {
    const li = el('li');
    li.append(editable(el('time'), () => x.time, v => x.time = v, { ph:'Thời gian' }),
      editable(el('h3'), () => x.title, v => x.title = v, { ph:'Trường' }),
      editable(el('p'), () => x.text, v => x.text = v, { ph:'Chuyên ngành, xếp loại' }));
    if (EDIT) { const t = el('div', '', 'tools'); t.append(toolBtn('Xoá', 'Xoá mục học vấn', () => { C.education.splice(i, 1); changed(); })); li.append(t); }
    return li;
  }));
  if (EDIT) { const b = toolBtn('+ Thêm học vấn', 'Thêm học vấn', () => { C.education.push({ time:'', title:'', text:'' }); changed(); }); b.className = 'tool'; ul.append(b); }
}

function renderSkills() {
  const dl = $('#skills'); dl.replaceChildren();
  C.skills.forEach((s, i) => {
    dl.append(editable(el('dt'), () => s.name, v => s.name = v, { ph:'Nhóm kỹ năng' }));
    const dd = editable(el('dd'), () => s.value, v => s.value = v, { ph:'Công cụ, kỹ năng' });
    dl.append(dd);
    if (EDIT) { const t = el('div', '', 'tools'); t.append(toolBtn('↑', 'Đưa lên', () => { move(C.skills, i, -1); changed(); }), toolBtn('↓', 'Đưa xuống', () => { move(C.skills, i, 1); changed(); }), toolBtn('Xoá', 'Xoá kỹ năng', () => { C.skills.splice(i, 1); changed(); })); dl.append(t); }
  });
  if (EDIT) { const b = toolBtn('+ Thêm kỹ năng', 'Thêm kỹ năng', () => { C.skills.push({ name:'', value:'' }); changed(); }); b.className = 'tool'; dl.append(b); }
}

/* ---------- Lưới dự án ---------- */
function artwork(p) {
  const art = el('span', '', 'art');
  art.style.setProperty('--card-bg', (p.colors || [])[0] || '#eae8db');
  art.style.setProperty('--card-ink', (p.colors || [])[1] || '#22241c');
  art.append(el('b', p.mark || ''));
  const fallback = coverSrc(p);
  const first = (!p._coverChanged && p.image) || fallback;
  if (first) {
    const img = el('img'); img.alt = p.title + ' – ' + p.brand; img.loading = 'lazy'; img.decoding = 'async';
    img.addEventListener('error', () => { if (fallback && img.getAttribute('src') !== fallback) img.src = fallback; else img.remove(); });
    img.src = first; art.append(img);
  } else art.setAttribute('aria-hidden', 'true');
  return art;
}

function renderFilters() {
  filters.replaceChildren(...C.groups.map(g => { const b = el('button', g); b.type = 'button'; b.addEventListener('click', () => renderGrid(g)); return b; }));
}

function renderGrid(group = activeGroup) {
  activeGroup = C.groups.includes(group) ? group : C.groups[0];
  for (const b of filters.children) b.setAttribute('aria-pressed', String(b.textContent === activeGroup));
  const all = shown();
  const visible = activeGroup === C.groups[0] ? all : all.filter(p => p.groups.includes(activeGroup));
  cards.replaceChildren(...visible.map(p => {
    const card = el('a', '', 'card' + (p.hidden ? ' is-hidden' : ''));
    card.href = '#da-' + p.slug;
    const copy = el('span', '', 'card-copy');
    const meta = el('span', '', 'meta');
    const n = (p.images || []).length;
    meta.append(el('small', (p.scope && p.scope.length ? p.scope.slice(0, 3) : p.groups).join(' · ')), el('small', n ? n + ' thiết kế' : 'Đang cập nhật'));
    copy.append(el('small', p.brand), el('strong', p.title), meta);
    card.append(artwork(p), copy);
    if (EDIT) {
      if (p.hidden) card.append(el('span', 'Đang ẩn', 'badge'));
      const t = el('span', '', 'tools'); const i = C.projects.indexOf(p);
      if (activeGroup === C.groups[0]) t.append(toolBtn('←', 'Đưa lên trước', () => { move(C.projects, i, -1); changed(); }), toolBtn('→', 'Đưa ra sau', () => { move(C.projects, i, 1); changed(); }));
      t.append(toolBtn((C.featured || []).includes(p.slug) ? '★' : '☆', 'Bật/tắt Dự án tiêu biểu', () => toggleFeatured(p)));
      t.append(toolBtn(p.hidden ? 'Hiện' : 'Ẩn', p.hidden ? 'Hiện dự án trên web' : 'Ẩn dự án khỏi web', () => { p.hidden = !p.hidden; changed(); }));
      card.append(t);
    }
    return card;
  }));
  $('#result').textContent = visible.length + ' dự án';
}

/* ---------- Trang chi tiết ---------- */
function majorityRatio(list) {
  if (!list.length) return '16/9';
  const square = list.filter(i => i.ratio < 1.25).length;
  return square > list.length / 2 ? '1/1' : '16/9';
}

function renderCase(p) {
  const list = p.images || [];
  const all = shown();
  const i = all.indexOf(p);
  const back = el('a', '← Tất cả dự án', 'back'); back.href = '#du-an';
  const head = el('header', '', 'case-head');
  const left = el('div');
  const title = el('h2'); title.id = 'case-title'; title.tabIndex = -1;
  editable(title, () => p.title, v => { p.title = v; document.title = v + ' · Portfolio Nguyễn Khoa'; }, { ph:'Tên dự án' });
  left.append(editable(el('p', '', 'label'), () => p.brand, v => p.brand = v, { ph:'Nhãn: thương hiệu / bối cảnh' }), title,
    editable(el('p', '', 'case-desc'), () => p.description, v => p.description = v, { multiline:true, ph:'Mô tả dự án' }));
  const meta = el('dl', '', 'case-meta');
  const add = (label, node) => { const wrap = el('div'); const dd = el('dd'); dd.append(node); wrap.append(el('dt', label), dd); meta.append(wrap); };
  if (EDIT) {
    add('Hạng mục (cách nhau bằng dấu ·)', editable(el('span'), () => (p.scope || []).join(' · '), v => p.scope = v.split(/[·,]/).map(s => s.trim()).filter(Boolean), { ph:'Logo · Bao bì · Poster' }));
    const checks = el('div', '', 'checks');
    C.groups.slice(1).forEach(g => { const l = el('label'); const c = el('input'); c.type = 'checkbox'; c.checked = p.groups.includes(g); c.addEventListener('change', () => { p.groups = C.groups.slice(1).filter(x => x === g ? c.checked : p.groups.includes(x)); changed(false); }); l.append(c, document.createTextNode(' ' + g)); checks.append(l); });
    add('Nhóm (bộ lọc)', checks);
  } else {

const pending = new Map();   // đường dẫn trong kho → base64
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const r = bmp.width / bmp.height, mx = r > 1.2 ? 1400 : 1200;
  const s = Math.min(1, mx / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(bmp, 0, 0, cv.width, cv.height);
  return { url: cv.toDataURL('image/jpeg', 0.85), ratio: Math.round(r * 1000) / 1000 };
}
async function addImages(p, files) {
  if (!files.length) return;
  status('Đang xử lý ' + files.length + ' ảnh…');
  for (const f of files) {
    try {
      const { url, ratio } = await shrink(f);
      const path = 'work/' + p.slug + '/u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) + '.jpg';
      pending.set(path, url.split(',')[1]);
      p.images = p.images || []; p.images.push({ src:path, ratio, _preview:url });
    } catch (e) { alert('Không đọc được ảnh ' + f.name); }
  }
  changed();
}

let dirty = false, contentSha = null, draftTimer = null;
const tokenKey = 'portfolio-gh-token', draftKey = 'portfolio-draft';
const getToken = () => { try { return localStorage.getItem(tokenKey) || ''; } catch { return ''; } };
function status(t) { const s = $('#edit-status'); if (s) s.textContent = t; }
function clean(obj) { return JSON.parse(JSON.stringify(obj, (k, v) => k.startsWith('_') ? undefined : v)); }
function changed(rerender = true) {
  dirty = true;
  if (rerender) { renderAll(); if (!caseView.hidden) route(); }

  $('#btn-save').disabled = false;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => { try { localStorage.setItem(draftKey, JSON.stringify({ at:Date.now(), C:clean(C) })); } catch {} }, 600);
}
async function gh(path, opt = {}) {
  const r = await fetch('https://api.github.com/repos/' + REPO + path, { ...opt, cache:'no-store', headers:{ Authorization:'Bearer ' + getToken(), Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(opt.body ? { 'Content-Type':'application/json' } : {}) } });
  if (!r.ok) { const t = await r.text(); const err = new Error(r.status + ' ' + t.slice(0, 160)); err.status = r.status; throw err; }
  return r.json();
}
function b64ToText(b64) { const bin = atob(b64.replace(/\n/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))); }

async function save() {
  if (!getToken()) { openToken(); return; }
  const btn = $('#btn-save'); btn.disabled = true; status('Đang lưu lên GitHub…');
  try {
    const ref = await gh('/git/ref/heads/' + BRANCH);
    const head = ref.object.sha;
    const commit = await gh('/git/commits/' + head);
    const cur = await gh('/contents/content.json?ref=' + head);
    if (contentSha && cur.sha !== contentSha && !confirm('Nội dung trên GitHub vừa được sửa ở nơi khác (có thể Claude vừa cập nhật). Bấm OK để ghi đè bằng bản của bạn, Huỷ để dừng và tải lại trang.')) { status('Đã dừng. Tải lại trang để lấy bản mới nhất.'); btn.disabled = false; return; }
    const tree = [];
    const used = new Set(C.projects.flatMap(p => (p.images || []).map(i => i.src)));
    for (const [path, b64] of pending) {
      if (!used.has(path)) continue;
      const blob = await gh('/git/blobs', { method:'POST', body:JSON.stringify({ content:b64, encoding:'base64' }) });
      tree.push({ path, mode:'100644', type:'blob', sha:blob.sha });
    }
    const blob = await gh('/git/blobs', { method:'POST', body:JSON.stringify({ content:JSON.stringify(clean(C), null, 1) + '\n', encoding:'utf-8' }) });
    tree.push({ path:'content.json', mode:'100644', type:'blob', sha:blob.sha });
    const t = await gh('/git/trees', { method:'POST', body:JSON.stringify({ base_tree:commit.tree.sha, tree }) });
    const nc = await gh('/git/commits', { method:'POST', body:JSON.stringify({ message:'Khoa sửa trên web (' + new Date().toLocaleString('vi-VN') + ')', tree:t.sha, parents:[head] }) });
    await gh('/git/refs/heads/' + BRANCH, { method:'PATCH', body:JSON.stringify({ sha:nc.sha }) });
    contentSha = blob.sha; pending.clear(); dirty = false;
    try { localStorage.removeItem(draftKey); } catch {}
    status('Đã lưu ✓ Web cập nhật sau khoảng 1–2 phút.');
  } catch (e) {
    btn.disabled = false;
    status(e.status === 401 || e.status === 403 || e.status === 404 ? 'Không lưu được: mã GitHub sai, hết hạn hoặc chưa có quyền ghi vào kho.' : 'Không lưu được: ' + e.message);
    if (e.status === 401) openToken();
  }
}

async function loadLatest() {
  if (EDIT && getToken()) {
    try { const cur = await gh('/contents/content.json?ref=' + BRANCH); contentSha = cur.sha; return JSON.parse(b64ToText(cur.content)); } catch (e) { if (e.status === 401) status('Mã GitHub hết hạn hoặc sai. Bấm "Mã GitHub" để nhập lại.'); }
  }
  try { const r = await fetch('content.json?t=' + Date.now(), { cache:'no-store' }); if (r.ok) return await r.json(); } catch {}
  return null;
}

(function reel() {
  const v = $('#reel'); if (!v) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { v.controls = true; return; }
  v.autoplay = true; v.play().catch(() => { v.controls = true; });
})();

(async function start() {
  if (EDIT) buildEditUI();
  if (C.projects) { renderAll(); route(); }
  const fresh = await loadLatest();
  if (fresh && JSON.stringify(fresh) !== JSON.stringify(C)) { C = fresh; renderAll(); route(); }
  if (EDIT) {
    let draft = null; try { draft = JSON.parse(localStorage.getItem(draftKey) || 'null'); } catch {}
    if (draft && JSON.stringify(draft.C) !== JSON.stringify(clean(C)) && confirm('Có bản nháp chưa lưu từ ' + new Date(draft.at).toLocaleString('vi-VN') + '. Khôi phục bản nháp? (Ảnh mới thêm trong bản nháp không giữ được)')) {
      const known = new Set(C.projects.flatMap(p => (p.images || []).map(i => i.src)));
      C = draft.C; C.projects.forEach(p => { p.images = (p.images || []).filter(i => known.has(i.src)); if ((p.cover || 0) >= p.images.length) p.cover = 0; });
      dirty = true; renderAll(); route(); $('#btn-save').disabled = false; status('Đã khôi phục bản nháp, chưa lưu.');
    } else status(getToken() ? 'Bấm vào chữ có viền chấm để sửa. Sửa xong bấm "Lưu lên web".' : 'Bấm vào chữ có viền chấm để sửa. Lần đầu cần nhập "Mã GitHub" trước khi lưu.');
  }
  window.addEventListener('hashchange', route);
})();
</script>
